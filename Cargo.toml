[package]
name = "hello"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"

serde = { version = "1.0.229", features = ["derive"] }

argon2 = "0.5"

sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }

tokio = {
    version = "1",
    features = ["macros", "rt-multi-thread"]
}

dotenvy = "0.15"
